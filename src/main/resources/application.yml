spring:
  application:
    name: TaskFlow

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:tarefas}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true



