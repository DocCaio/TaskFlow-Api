spring:
  application:
    name: TaskFlow

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:tarefas}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

  scalar:
    path: /api/docs
    dark-mode: true
    theme: bluePlanet
    page-title: Task API